name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build

  docker-config:
    # Catches exactly the class of bug that sat undetected here for a long
    # time: docker-compose.yml and both Dockerfiles had unresolved merge
    # conflict markers in them, so `docker compose up` had never actually
    # worked. This just validates the compose files parse; it doesn't build
    # or run anything.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.yml config > /dev/null
      - name: Validate production compose (dummy env)
        run: |
          cp .env.production.example .env.production.ci
          echo "APP_DOMAIN=example.com" >> .env.production.ci
          docker compose -f docker-compose.prod.yml --env-file .env.production.ci config > /dev/null
