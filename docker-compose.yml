version: '3.8'

# Local/dev Docker stack. For a real deployment with wildcard subdomains and
# TLS, use docker-compose.prod.yml instead (see DEPLOYMENT.md).

services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - DB_TYPE=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=posq
      - DB_USER=posq
      - DB_PASSWORD=posqpassword
      - JWT_SECRET=dev-secret-change-in-production
      - FRONTEND_URL=http://localhost:5173
      - PORT=3001
    volumes:
      - ./server/uploads:/app/uploads
      - ./server/logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - posq-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3001
    depends_on:
      - api
    networks:
      - posq-network

  printer:
    build:
      context: ./printer-service
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - API_URL=http://api:3001
    depends_on:
      - api
    networks:
      - posq-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - posq-network

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=posq
      - MYSQL_USER=posq
      - MYSQL_PASSWORD=posqpassword
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - posq-network

volumes:
  redis_data:
  mysql_data:

networks:
  posq-network:
    driver: bridge
